name: Docs
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install root deps (for TypeDoc entrypoint resolution)
        run: npm ci
      - name: Install docs deps
        working-directory: docs
        run: npm ci
      - name: Build docs
        working-directory: docs
        run: npm run build
      - if: github.repository != 'axiomantic/template-typescript'
        uses: actions/configure-pages@v6
      - if: github.repository != 'axiomantic/template-typescript'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
  deploy:
    if: github.repository != 'axiomantic/template-typescript'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
